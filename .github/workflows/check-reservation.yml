name: Check Reservation

on:
  repository_dispatch:
    types: [check-reservation]
  workflow_dispatch: {}   # 手動実行用ボタンも使えるようにする

permissions:
  contents: write   # notified_slots.json をコミットし直すために必要

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 358   # 5時間58分。スクリプト側のWATCH_DURATION_MINUTES(355分)より少し長めに
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run reservation watch
        env:
          NCORS_USERID: ${{ secrets.NCORS_USERID }}
          NCORS_PASSWORD: ${{ secrets.NCORS_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WATCH_DURATION_MINUTES: '355'   # 最大約6時間(ジョブ上限内)監視を継続
          WATCH_INTERVAL_SECONDS: '240'   # 4分おきにページ更新 (セッションが5分でタイムアウトするため)
        run: python3 check_reservation.py

      - name: Save updated state back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notified_slots.json
          git diff --staged --quiet || git commit -m "update notified slots [skip ci]"
          git push
